name: release-desktop-mac-linux

# Builds the desktop app for macOS and Linux and uploads the installers to an
# existing GitHub release, complementing the Windows build that's still done
# manually on prod. Triggered by hand after promoting dev -> prod and doing
# the local Windows release, so the version to build is passed explicitly
# rather than inferred from a tag push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to build (e.g. 1.20.16), must match an existing vX.Y.Z GitHub release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'alltomatos/opencode'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          - os: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: prod

      - name: Install rpm (linux only, needed by electron-builder's fpm packaging)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - uses: ./.github/actions/setup-bun

      - name: Set version
        working-directory: packages/desktop
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build and publish
        working-directory: packages/desktop
        run: bun run build && bun run ${{ matrix.script }} -- --publish always
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
