name: release-desktop

# Builds and publishes the desktop app for Windows, macOS, and Linux whenever
# the prod branch is promoted (or manually, as a retry/backfill). The version
# comes from packages/desktop/package.json as committed on prod — bump it
# there before promoting, the same way this fork already does locally.
on:
  push:
    branches:
      - prod
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'alltomatos/opencode'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: macos-latest
            script: package:mac
            extra_args: --universal
          - os: ubuntu-latest
            script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Install rpm (linux only, needed by electron-builder's fpm packaging)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - uses: ./.github/actions/setup-bun

      - name: Get version
        id: version
        working-directory: packages/desktop
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        working-directory: packages/desktop
        # package:* scripts run `bun run build` themselves — see
        # ORCHESTRATOR-ROADMAP.md for why (running package:win standalone
        # used to silently ship whatever stale/incomplete out/ happened to
        # be on disk, missing out/renderer entirely if the last local build
        # was `dev`, which never writes it there).
        run: bun run ${{ matrix.script }} -- ${{ matrix.extra_args }} --publish always
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # macos-latest (arm64) OOM'd mid-build (V8 heap exhaustion) building
          # the --universal (arm64+x64) mac target — the main-process bundle
          # is large (~33MB, the whole opencode server inlined) and Node's
          # default heap sizing wasn't enough headroom for it. Harmless on
          # Windows/Linux runners, which have more RAM to begin with.
          NODE_OPTIONS: --max-old-space-size=6144

  publish-release:
    # electron-builder's GitHub publisher always creates the release as a
    # draft (no config knob flips this per-run, and three parallel matrix
    # jobs racing to finalize the same release is unreliable — see the
    # commit that added this job to release-desktop-dev.yml).
    # electron-updater ignores draft releases, so without this step the
    # prod channel silently stops auto-updating. Un-draft only after all
    # three platform builds succeed, so a partial/failed build never ships
    # as if complete.
    needs: build
    if: github.repository == 'alltomatos/opencode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Publish the prod release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          gh release edit "v${version}" --draft=false --latest --repo alltomatos/opencode
