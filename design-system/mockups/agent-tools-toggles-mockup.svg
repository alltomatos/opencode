<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#0d111a"/>

  <!-- Top Modal Header -->
  <text x="30" y="45" fill="#f8fafc" font-size="18" font-weight="600">Editar Agente</text>
  
  <rect x="990" y="25" width="80" height="32" rx="6" fill="#1e2738" stroke="#334155" stroke-width="1"/>
  <text x="1013" y="46" fill="#cbd5e1" font-size="13">Testar</text>

  <rect x="1080" y="25" width="80" height="32" rx="6" fill="#1e2738" stroke="#334155" stroke-width="1"/>
  <text x="1105" y="46" fill="#cbd5e1" font-size="13">Salvar</text>

  <text x="1175" y="46" fill="#64748b" font-size="16">✕</text>

  <line x1="0" y1="70" x2="1200" y2="70" stroke="#1c2333" stroke-width="1"/>

  <!-- Main Split Body -->
  <!-- Coluna da Esquerda: Dados do Agente -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="460" height="36" rx="6" fill="#121724" stroke="#1e2638" stroke-width="1"/>
    <text x="15" y="22" fill="#94a3b8" font-size="12">⚡ Criar com IA ▾</text>

    <text x="0" y="65" fill="#cbd5e1" font-size="13" font-weight="500">Nome</text>
    <rect x="0" y="75" width="460" height="36" rx="6" fill="#121724" stroke="#1e2638" stroke-width="1"/>
    <text x="15" y="98" fill="#f8fafc" font-size="13">Ronaldo pessoal</text>

    <text x="0" y="140" fill="#cbd5e1" font-size="13" font-weight="500">Personalidade</text>
    <rect x="0" y="150" width="460" height="280" rx="6" fill="#121724" stroke="#1e2638" stroke-width="1"/>
    <text x="15" y="180" fill="#cbd5e1" font-size="13">Meu nome e Ronaldo davi, sou socio na empresa protectit...</text>
    <text x="15" y="205" fill="#a78bfa" font-size="12">💡 Dica: Agente com acesso a lembretes e memória contínua.</text>
  </g>

  <!-- Divisor Central -->
  <line x1="560" y1="70" x2="560" y2="700" stroke="#1c2333" stroke-width="1"/>

  <!-- Coluna da Direita: Abas & Configurações de Ferramentas -->
  <g transform="translate(580, 80)">
    <!-- Abas -->
    <text x="20" y="20" fill="#64748b" font-size="13">Geral</text>
    <text x="75" y="20" fill="#64748b" font-size="13">Canais</text>
    <text x="135" y="20" fill="#f8fafc" font-size="13" font-weight="600">Ferramentas</text>
    <line x1="135" y1="28" x2="215" y2="28" stroke="#38bdf8" stroke-width="2"/>
    <text x="235" y="20" fill="#64748b" font-size="13">Conhecimento</text>

    <!-- Seção Servidores MCP -->
    <text x="20" y="65" fill="#f8fafc" font-size="14" font-weight="600">Servidores MCP</text>
    <text x="20" y="85" fill="#64748b" font-size="12">Permite que este agente use ferramentas de servidores conectados.</text>

    <!-- MCP izapia -->
    <text x="20" y="125" fill="#cbd5e1" font-size="13">izapia</text>
    <rect x="520" y="112" width="38" height="20" rx="10" fill="#8b5cf6"/>
    <circle cx="546" cy="122" r="8" fill="#ffffff"/>

    <!-- MCP mcpmail -->
    <text x="20" y="165" fill="#cbd5e1" font-size="13">mcpmail</text>
    <rect x="520" y="152" width="38" height="20" rx="10" fill="#8b5cf6"/>
    <circle cx="546" cy="122" r="8" fill="#ffffff" transform="translate(0, 40)"/>

    <line x1="20" y1="200" x2="560" y2="200" stroke="#1c2333" stroke-width="1"/>

    <!-- Seção: Acesso a Rotinas (Existente) -->
    <text x="20" y="230" fill="#f8fafc" font-size="14" font-weight="600">Acesso a Rotinas</text>
    <text x="20" y="250" fill="#64748b" font-size="12">Permitir que este agente liste e consulte rotinas agendadas (routine).</text>
    <rect x="520" y="235" width="38" height="20" rx="10" fill="#8b5cf6"/>
    <circle cx="546" cy="245" r="8" fill="#ffffff"/>

    <line x1="20" y1="285" x2="560" y2="285" stroke="#1c2333" stroke-width="1"/>

    <!-- NOVO TOGGLE: FERRAMENTAS DE AGENDA & LEMBRETES -->
    <rect x="15" y="295" width="550" height="90" rx="8" fill="#141a29" stroke="#2563eb" stroke-width="1"/>
    <text x="30" y="325" fill="#60a5fa" font-size="14" font-weight="600">📅 Ferramentas de Agenda &amp; Lembretes (reminder)</text>
    <text x="30" y="348" fill="#94a3b8" font-size="12">Permite ao agente criar compromissos e lembretes pontuais</text>
    <text x="30" y="366" fill="#94a3b8" font-size="12">direto pela conversa nos canais (WhatsApp, Telegram, Desktop).</text>
    <!-- Switch Ativo Roxo -->
    <rect x="510" y="330" width="38" height="20" rx="10" fill="#8b5cf6"/>
    <circle cx="536" cy="340" r="8" fill="#ffffff"/>

    <!-- NOVO TOGGLE: MEMÓRIA CONTÍNUA & COMPACTAÇÃO -->
    <rect x="15" y="395" width="550" height="90" rx="8" fill="#16152a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="30" y="425" fill="#c084fc" font-size="14" font-weight="600">🧠 Memória Contínua &amp; Compactação (memory)</text>
    <text x="30" y="448" fill="#94a3b8" font-size="12">Permite ao agente gravar decisões importantes (memory_save) e</text>
    <text x="30" y="466" fill="#94a3b8" font-size="12">resgatar fatos (memory_search) sem reler todo o histórico de mensagens.</text>
    <!-- Switch Ativo Roxo -->
    <rect x="510" y="430" width="38" height="20" rx="10" fill="#8b5cf6"/>
    <circle cx="536" cy="440" r="8" fill="#ffffff"/>
  </g>
</svg>
