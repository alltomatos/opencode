      <!-- Grade Mensal -->
      <!-- Linha 1 (Dias 27 a 03) -->
      <g stroke="#1c2333" stroke-width="1" fill="#0d111a">
        <rect x="0" y="15" width="168" height="140" fill="#090d16" fill-opacity="0.5"/>
        <rect x="168" y="15" width="168" height="140" fill="#090d16" fill-opacity="0.5"/>
        <rect x="336" y="15" width="168" height="140" fill="#090d16" fill-opacity="0.5"/>
        <rect x="504" y="15" width="168" height="140"/>
        <rect x="672" y="15" width="168" height="140"/>
        <rect x="840" y="15" width="168" height="140"/>
        <rect x="1008" y="15" width="168" height="140"/>
      </g>
      <!-- Números Linha 1 -->
      <g fill="#475569" font-size="12">
        <text x="10" y="35">27</text>
        <text x="178" y="35">28</text>
        <text x="346" y="35">29</text>
      </g>
      <g fill="#cbd5e1" font-size="12">
        <text x="514" y="35">30</text>
        <text x="682" y="35">01</text>
        <text x="850" y="35">02</text>
        <text x="1018" y="35">03</text>
      </g>

      <!-- Linha 2 (Dias 04 a 10) - ONDE ESTÃO OS LEMBRETES -->
      <g stroke="#1c2333" stroke-width="1" fill="#0d111a">
        <rect x="0" y="155" width="168" height="160"/>
        <rect x="168" y="155" width="168" height="160"/>
        <rect x="336" y="155" width="168" height="160"/>
        <!-- Dia 07 (Quarta-Feira) -->
        <rect x="504" y="155" width="168" height="160" fill="#121724" stroke="#2563eb" stroke-width="1.5"/>
        <!-- Dia 08 (Quinta-Feira) -->
        <rect x="672" y="155" width="168" height="160" fill="#121724"/>
        <rect x="840" y="155" width="168" height="160"/>
        <rect x="1008" y="155" width="168" height="160"/>
      </g>
      
      <!-- Números Linha 2 -->
      <g fill="#cbd5e1" font-size="12">
        <text x="10" y="175">04</text>
        <text x="178" y="175">05</text>
        <text x="346" y="175">06</text>
        <!-- Destaque Quarta 07 -->
        <circle cx="520" cy="172" r="11" fill="#2563eb"/>
        <text x="513" y="176" fill="#ffffff" font-weight="700">07</text>
        <text x="682" y="175">08</text>
        <text x="850" y="175">09</text>
        <text x="1018" y="175">10</text>
      </g>

      <!-- CARD DE LEMBRETE: QUARTA 07 (Rodrigo Peixoto / WhatsApp) -->
      <g transform="translate(510, 195)">
        <rect x="0" y="0" width="156" height="74" rx="6" fill="#16222f" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
        <circle cx="12" cy="15" r="4" fill="#10b981"/>
        <text x="22" y="19" fill="#10b981" font-size="11" font-weight="600">08:30 • WhatsApp</text>
        <text x="10" y="38" fill="#f8fafc" font-size="12" font-weight="600">Rodrigo Peixoto</text>
        <text x="10" y="52" fill="#94a3b8" font-size="10">Confirmar reunião</text>
        <rect x="10" y="58" width="55" height="12" rx="3" fill="#0d111a"/>
        <text x="14" y="67" fill="#64748b" font-size="8">Pendente</text>
      </g>

      <!-- CARD DE COMPROMISSO: QUINTA 08 (Mix Cegás / AgentUI) -->
      <g transform="translate(678, 195)">
        <rect x="0" y="0" width="156" height="74" rx="6" fill="#1a1c2e" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
        <circle cx="12" cy="15" r="4" fill="#8b5cf6"/>
        <text x="22" y="19" fill="#a78bfa" font-size="11" font-weight="600">10:00 • Alinhamento</text>
        <text x="10" y="38" fill="#f8fafc" font-size="12" font-weight="600">Mix Cegás / GNR</text>
        <text x="10" y="52" fill="#94a3b8" font-size="10">Apresentação pauta</text>
        <rect x="10" y="58" width="55" height="12" rx="3" fill="#0d111a"/>
        <text x="14" y="67" fill="#8b5cf6" font-size="8">Agendado</text>
      </g>

      <!-- Linha 3 (Dias 11 a 17) -->
      <g stroke="#1c2333" stroke-width="1" fill="#0d111a">
        <rect x="0" y="315" width="168" height="140"/>
        <rect x="168" y="315" width="168" height="140"/>
        <rect x="336" y="315" width="168" height="140"/>
        <rect x="504" y="315" width="168" height="140"/>
        <rect x="672" y="315" width="168" height="140"/>
        <rect x="840" y="315" width="168" height="140"/>
        <rect x="1008" y="315" width="168" height="140"/>
      </g>
      <g fill="#cbd5e1" font-size="12">
        <text x="10" y="335">11</text>
        <text x="178" y="335">12</text>
        <text x="346" y="335">13</text>
        <text x="514" y="335">14</text>
        <text x="682" y="335">15</text>
        <text x="850" y="335">16</text>
        <text x="1018" y="335">17</text>
      </g>

      <!-- Linha 4 (Dias 18 a 24) -->
      <g stroke="#1c2333" stroke-width="1" fill="#0d111a">
        <rect x="0" y="455" width="168" height="140"/>
        <rect x="168" y="455" width="168" height="140"/>
        <rect x="336" y="455" width="168" height="140"/>
        <rect x="504" y="455" width="168" height="140"/>
        <rect x="672" y="455" width="168" height="140"/>
        <rect x="840" y="455" width="168" height="140"/>
        <rect x="1008" y="455" width="168" height="140"/>
      </g>
      <g fill="#cbd5e1" font-size="12">
        <text x="10" y="475">18</text>
        <text x="178" y="475">19</text>
        <text x="346" y="475">20</text>
        <text x="514" y="475">21</text>
        <text x="682" y="475">22</text>
        <text x="850" y="475">23</text>
        <text x="1018" y="475">24</text>
      </g>
    </g>
  </g>
</svg>
