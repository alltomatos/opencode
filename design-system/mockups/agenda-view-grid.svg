        <text x="210" y="0">SEGUNDA</text>
        <text x="385" y="0">TERÇA</text>
        <text x="545" y="0">QUARTA</text>
        <text x="720" y="0">QUINTA</text>
        <text x="895" y="0">SEXTA</text>
        <text x="1060" y="0">SÁBADO</text>
